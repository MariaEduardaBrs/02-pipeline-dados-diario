name: Publicar

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: 
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  coletar:
      name: Coletar e gerar gráfico
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
       - uses: actions/checkout@v4

       - uses: actions/checkout@v4
         with:
          ref: dados
          path: historico
       - uses: actions/setup-python@v5
         with:
           python-version: "3.13"
       - name: Rodar o pipeline
         run: |
           python - <<'PY'
           import pipeline
           novos = pipeline.executar("historico/historico.csv", "site/grafico.svg")
           print("Registros novos:", novos)
           PY
       - name: Guardar o histórico na branch dados
         working-directory: historico
         run: |
           git config user.name "github-actions[bot]"
           git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
           git add historico.csv
           if git diff --cached --quiet; then
            echo "Sem mudança no histórico."
              else
            git commit -m "Atualiza historico de dados"
            git push origin HEAD:dados
            fi
       - uses: actions/upload-pages-artifact@v4
         with:
           path: site
  publicar:
    name: Publicar no Pages
    needs: coletar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
       
        
